# ==============================================
# Shell
# ==============================================
# Force all tmux panes to launch zsh
set -g default-shell /usr/bin/zsh

# ==============================================
# TPM Plugin Manager
# ==============================================
# Entry point for tmux-plugins/tpm
set -g @plugin "tmux-plugins/tpm"

# ==============================================
# Installed Plugins
# ==============================================
# Seamless hjkl navigation between Vim and Tmux
set -g @plugin "christoomey/vim-tmux-navigator"
# Rose Pine color theme
set -g @plugin "rose-pine/tmux"

# ==============================================
# Basic Settings
# ==============================================
# Start window numbering at 1 instead of 0
set -g base-index 1
# Start pane numbering at 1 instead of 0
set -g pane-base-index 1
# Place the status bar at the top
set-option -g status-position top
# Enable focus events so programs can detect pane focus changes
set-option -g focus-events on
# Time (ms) that a key prefix remains active for repeat bindings
set-option -g repeat-time 300
# Remove delay after pressing Escape
set -sg escape-time 0
# Enable mouse support (select panes, resize, scroll)
set -g mouse on
# Renumber windows automatically when one is closed
set -g renumber-windows on

# ==============================================
# Pane Border / Divider
# ==============================================
# Show a status line at the top of each pane
setw -g pane-border-status top
# Empty border format (no text shown in the border)
setw -g pane-border-format ""
# Use single-line drawing characters for borders
setw -g pane-border-lines single
# Color of inactive pane borders
setw -g pane-border-style fg="#575268"
# Color of the active pane border
setw -g pane-active-border-style fg="#c4a7e7"

# ==============================================
# Terminal & Color Support
# ==============================================
# Use 256-color terminal type
set -g default-terminal "tmux-256color"
# Enable true-color (RGB) support for all terminals
set -ga terminal-overrides ',*:RGB'
# Enable true-color (Tc) capability
set -ga terminal-overrides ',*:Tc'

# ==============================================
# Rose Pine Moon Theme Config
# ==============================================
# Use the "moon" variant of Rose Pine
set -g @rose_pine_variant 'moon'
# Show hostname in the status bar
set -g @rose_pine_host 'on'
# Date/time display (empty = hidden)
set -g @rose_pine_date_time ''
# Show username in the status bar
set -g @rose_pine_user 'on'
# Show current directory in the status bar
set -g @rose_pine_directory 'on'
# Disable the status bar background
set -g @rose_pine_bar_bg_disable 'on'
# Background color used when the bar background is disabled
set -g @rose_pine_bar_bg_disabled_color_option 'default'
# Use default window behavior
set -g @rose_pine_default_window_behavior 'on'
# Show the current running program in the status bar
set -g @rose_pine_show_current_program 'on'
# Show the pane directory in the status bar
set -g @rose_pine_show_pane_directory 'on'
# Separator between left-side status elements
set -g @rose_pine_left_separator ' > '
# Separator between right-side status elements
set -g @rose_pine_right_separator ' <- '
# Separator between fields
set -g @rose_pine_field_separator ' | '
# Separator between windows
set -g @rose_pine_window_separator ' - '
# Icon for the session
set -g @rose_pine_session_icon ''
# Icon for the current window
set -g @rose_pine_current_window_icon ''
# Icon for the hostname
set -g @rose_pine_hostname_icon '󰒋'
# Icon for date/time
set -g @rose_pine_date_time_icon '󰃰'
# Separator for window status entries
set -g @rose_pine_window_status_separator "  "
# Prioritize specific windows (empty = no priority)
set -g @rose_pine_prioritize_windows ''
# Status bar width threshold (in columns) below which elements are hidden
set -g @rose_pine_width_to_hide '80'
# Maximum number of windows to show in the status bar
set -g @rose_pine_window_count '5'

# ==============================================
# Pane Split Keybindings
# ==============================================
# Unbind default horizontal split key
unbind %
# Split horizontally with |
bind | split-window -h
# Unbind default vertical split key
unbind '"'
# Split vertically with -
bind - split-window -v

# ==============================================
# Reload Configuration
# ==============================================
# Unbind default reload key
unbind r
# Reload tmux config with r
bind r source-file ~/.tmux.conf

# ==============================================
# Pane Resize Keybindings
# ==============================================
# Resize pane down (repeatable with -r)
bind -r j resize-pane -D 5
# Resize pane up
bind -r k resize-pane -U 5
# Resize pane right
bind -r l resize-pane -R 5
# Resize pane left
bind -r h resize-pane -L 5
# Toggle pane zoom
bind -r m resize-pane -Z

# ==============================================
# Vi Style Copy Mode
# ==============================================
# Use vi-style keys in copy mode
set-window-option -g mode-keys vi
# Begin selection with v
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
# Copy selection and exit with y
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
# Toggle rectangle selection with Ctrl-v
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Disable mouse-drag copy end so selection isn't cancelled
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================
# TPM Initialize (must be the last line)
# ==============================================
run "~/.config/tmux/plugins/tpm/tpm"
